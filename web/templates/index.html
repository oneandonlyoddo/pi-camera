<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Roll</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <header>
        <h1>Camera Roll</h1>
    </header>

    <div id="views">
        <!-- Gallery View -->
        <main id="gallery-view" class="view active">
            <div id="gallery" class="gallery-grid">
                <!-- Photos will be loaded here -->
                <div class="loading">Loading photos...</div>
            </div>
        </main>

        <!-- Settings View -->
        <main id="settings-view" class="view">
            <div class="settings-container">
                <div class="control-group">
                    <button id="shutter-btn" class="shutter-button">
                        <div class="shutter-inner"></div>
                    </button>
                    <p class="shutter-label">Take Photo</p>
                </div>

                <div class="control-group">
                    <label for="gain-slider">Analogue Gain: <span id="gain-val">Auto</span></label>
                    <input type="range" id="gain-slider" min="0" max="16" step="0.1" value="0">
                    <div class="slider-labels">
                        <span>Auto</span>
                        <span>16x</span>
                    </div>
                </div>

                <div class="control-group">
                    <label for="temp-slider">Color Temp: <span id="temp-val">Auto</span></label>
                    <input type="range" id="temp-slider" min="0" max="8000" step="100" value="0">
                    <div class="slider-labels">
                        <span>Auto</span>
                        <span>8000K</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchView('gallery')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Gallery</span>
        </button>
        <button class="nav-btn" onclick="switchView('settings')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
            <span>Settings</span>
        </button>
    </nav>

    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPhotos();
            setupControls();
        });

        function switchView(viewName) {
            // Hide all views
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            // Show selected view
            document.getElementById(`${viewName}-view`).classList.add('active');

            // Update nav state
            const btnIndex = viewName === 'gallery' ? 0 : 1;
            document.querySelectorAll('.nav-btn')[btnIndex].classList.add('active');
        }

        function setupControls() {
            const shutterBtn = document.getElementById('shutter-btn');
            const gainSlider = document.getElementById('gain-slider');
            const tempSlider = document.getElementById('temp-slider');

            // Shutter
            shutterBtn.addEventListener('click', () => {
                shutterBtn.classList.add('pressed');
                setTimeout(() => shutterBtn.classList.remove('pressed'), 200);

                fetch('/api/trigger', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => console.log('Shutter:', data))
                    .catch(err => console.error(err));
            });

            // Sliders
            gainSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('gain-val').innerText = val == 0 ? 'Auto' : val + 'x';
            });

            gainSlider.addEventListener('change', (e) => {
                updateSettings({ gain: e.target.value });
            });

            tempSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('temp-val').innerText = val == 0 ? 'Auto' : val + 'K';
            });

            tempSlider.addEventListener('change', (e) => {
                updateSettings({ color_temp: e.target.value });
            });

            // Load initial settings
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    if (data.status !== 'error') {
                        gainSlider.value = data.gain;
                        document.getElementById('gain-val').innerText = data.gain == 0 ? 'Auto' : data.gain + 'x';

                        tempSlider.value = data.color_temp;
                        document.getElementById('temp-val').innerText = data.color_temp == 0 ? 'Auto' : data.color_temp + 'K';
                    }
                });
        }

        function updateSettings(data) {
            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(data => console.log('Settings updated:', data));
        }

        function loadPhotos() {
            fetch('/api/photos')
                .then(response => response.json())
                .then(files => {
                    const gallery = document.getElementById('gallery');
                    gallery.innerHTML = ''; // Clear loading message

                    if (files.length === 0) {
                        gallery.innerHTML = '<div class="empty-state">No photos yet</div>';
                        return;
                    }

                    files.forEach(filename => {
                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'photo-item';

                        const img = document.createElement('img');
                        // Use thumbnail for gallery display
                        img.src = `/dcim/thumbs/${filename}`;
                        img.alt = filename;
                        img.loading = 'lazy'; // Lazy load images
                        // Store full image path in data attribute
                        img.dataset.fullImage = `/dcim/${filename}`;
                        img.onclick = () => openModal(img.dataset.fullImage);

                        imgContainer.appendChild(img);
                        gallery.appendChild(imgContainer);
                    });
                })
                .catch(err => {
                    console.error('Error loading photos:', err);
                    document.getElementById('gallery').innerHTML = '<div class="error">Failed to load photos</div>';
                });
        }

        function openModal(src) {
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modal-img');
            modal.style.display = "flex";
            modalImg.src = src;
        }

        function closeModal() {
            document.getElementById('modal').style.display = "none";
        }
    </script>
</body>

</html>
