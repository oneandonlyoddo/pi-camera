# Lint config. Runs on the desktop via `uvx ruff@0.17.5 check` (hook: .claude/hooks/ruff_check.py).
# Target = Python on the Pi (Raspberry Pi OS / Debian 13 trixie: Python 3.13).
target-version = "py313"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# Temporary, until the star imports are replaced (audit 08e0746, finding 7). Delete then.
# settings.py F401: hud.py gets `Path` through `from settings import *`; removing it breaks the HUD.
"digital_camera.py" = ["F403", "F405"]
"hud.py" = ["F403", "F405"]
"settings.py" = ["F401"]
